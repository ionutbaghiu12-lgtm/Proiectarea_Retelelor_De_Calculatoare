spring.application.name=chat67
server.port=${PORT:3000}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=jdbc:h2:file:./data/chat67
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=false
server.error.include-message=never
app.chats-dir=./data/chats
# Optional: creeaza un administrator la prima pornire, fara parola in cod.
app.admin.email=${CHAT67_ADMIN_EMAIL:}
app.admin.password=${CHAT67_ADMIN_PASSWORD:}
